<section id="status">
    <h2>Currently</h2>
    <p id="current-status">Loading...</p>
    <p id="status-since"></p>

    <h2>Status History</h2>
    <div id="status-history"></div>
</section>

<script>
async function loadStatus() {
    const current = await fetch('data/current.json')
        .then(r => r.json());

    const history = await fetch('data/history.json')
        .then(r => r.json());

    document.getElementById('current-status').textContent =
        current.status;

    const active = history[history.length - 1];

    document.getElementById('status-since').textContent =
        "Since " + active.start;

    document.getElementById('status-history').innerHTML =
        history.slice().reverse().map(item => `
            <p>
                <strong>${item.status}</strong><br>
                ${item.start} — ${item.end ?? "Present"}
            </p>
        `).join('');
}

loadStatus();
</script>

</body>
</html>
